plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id "me.shedaniel.unified-publishing" version "0.1.+"
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = mod_version
group = 'io.ticticboom.mods.mm' // http://maven.apache.org/guides/mini/guide-naming-conventions.html

base {
    archivesName = mod_archive_name
}

// Minecraft 26.1 runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

runs {
    configureEach {
        // Recommended logging data for a userdev environment.
        // The markers can be added/removed as needed, separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        // Recommended logging level for the console.
        systemProperty 'forge.logging.console.level', 'debug'

        // Both source sets have to be named. The bare modSource(SourceSet) form attaches every
        // source set to the project's own mod id, which put the test source set under "mm" and
        // left TestRoot's @Mod("mmtest") entrypoint dangling. This mirrors the two-mod layout the
        // 1.20.1 build declared through its mods { mm { ... } mmtest { ... } } block.
        modSources {
            add 'mm', project.sourceSets.main
            add 'mmtest', project.sourceSets.test
        }
    }

    client {
        workingDirectory project.file('run/client')
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mm'
    }

    server {
        workingDirectory project.file('run/server')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mm'
        argument '--nogui'
    }

    // This run config launches the game test server and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        workingDirectory project.file('run/test_server')
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mm'
    }

    // 1.21.4 split data generation into clientData and serverData; clientData runs both providers
    clientData {
        workingDirectory project.file('run/data')
        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', 'mm', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

minecraft {
    // NeoGradle does not pick the file up from its conventional location on its own here, and
    // without it AbstractContainerMenu.addSlot stays protected and every menu fails to compile.
    accessTransformers {
        file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

// 26.1 ships unobfuscated with Mojang's parameter names, so no Parchment mappings are needed.

// Compat for mods without a 26.1.2 release yet (see the dependencies). The code stays in the repository and comes
// back by removing its line once the mod is out.
sourceSets.main.java {
    exclude 'io/ticticboom/mods/mm/port/mekanism/**'          // Mekanism
    exclude 'io/ticticboom/mods/mm/compat/mekanism/**'
    exclude 'io/ticticboom/mods/mm/cap/MekCapabilities.java'
    exclude 'io/ticticboom/mods/mm/compat/ae2/ChemicalBridge.java'
    exclude 'io/ticticboom/mods/mm/compat/ae2/linker/ChemicalDrainer.java'
    exclude 'io/ticticboom/mods/mm/compat/ae2/pattern/Ae2ChemicalKeys.java'
    exclude 'io/ticticboom/mods/mm/gateway/GatewayChemicalHandler.java'
    exclude 'io/ticticboom/mods/mm/port/pneumaticcraft/**'    // PneumaticCraft
    exclude 'io/ticticboom/mods/mm/cap/PncCapabilities.java'
    exclude 'io/ticticboom/mods/mm/compat/ae2/AirBridge.java'
    exclude 'io/ticticboom/mods/mm/port/kinetic/**'           // Create
    exclude 'io/ticticboom/mods/mm/port/ars/**'               // Ars Nouveau
    exclude 'io/ticticboom/mods/mm/cap/ArsCapabilities.java'
    exclude 'io/ticticboom/mods/mm/compat/ae2/SourceBridge.java'
    exclude 'io/ticticboom/mods/mm/port/projecte/**'          // ProjectE
    exclude 'io/ticticboom/mods/mm/cap/ProjectECapabilities.java'
    exclude 'io/ticticboom/mods/mm/compat/ae2/MatterKeys.java'          // Replication AE2 bridge
    exclude 'io/ticticboom/mods/mm/compat/ae2/MatterBridge.java'
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here.
    // NeoGradle automatically adds the NeoForged maven and Maven Central for you.

    maven {
        name = "latvian"
        url = "https://maven.latvian.dev/releases"
    }
    maven {
        // location of the maven that hosts JEI files
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        // maven mirror for JEI files, as a fallback
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        url = "https://maven.ithundxr.dev/snapshots"
    } // Primary mirror for Registrate artifacts

    // Alternatively, you can use the Create Maven:
    // maven { url = "https://maven.createmod.net" }
    //}
    maven {
        url 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url 'https://maven.saps.dev/minecraft'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        url 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup 'maven.modrinth'
        }
    } // Replication

    maven {
        url = "https://maven.blamejared.com"
        content {
            includeGroup 'com.hollingsworth.ars_nouveau'
        }
    } // Ars Nouveau

    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven {
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
    maven {
        url = "https://maven.blakesmods.com/"
        content {
            includeGroupByRegex 'com\\.blakebr0\\..*'
        }
    }

    mavenCentral()
    maven { url = "https://jitpack.io" }
}

// NeoForge ships Mixin, and production runs on Mojang mappings, so neither the Mixin
// annotation processor nor MixinExtras needs to be declared the way ForgeGradle required.
dependencies {
    // plain JUnit tests of logic that needs no running game (src/test)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    implementation "net.neoforged:neoforge:${neoforge_version}"

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // Mods with a 26.1.2 release. Mekanism, PneumaticCraft, Create, Ars Nouveau, ProjectE, Applied Mekanistics,
    // Ars Energistique, Applied Pneumatics and the Replication AE2 bridge have none yet: their compat is left out of
    // the build (see the excludes below) until they do.
    compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    compileOnly "com.hrznstudio:titanium:${titanium_version}"
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly "maven.modrinth:replication:${replication_version}"
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    // AE2 in the dev runtime (and so the GameTest server), as in the 1.20.1 build; it needs GuideME
    runtimeOnly "maven.modrinth:ae2:${ae2_version}"
    runtimeOnly "maven.modrinth:guideme:${guideme_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "maven.modrinth:nuclear-radiation:${nuclear_radiation_version}"
    compileOnly "maven.modrinth:appflux:${appflux_version}"
    compileOnly "maven.modrinth:geckolib:${geckolib_version}"

    runtimeOnly "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"
}

// Expands the declared properties in neoforge.mods.toml so versions live in one place.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: mc_version,
            neo_version      : neoforge_version,
            mod_version      : mod_version,
            mod_authors      : mod_authors
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_archive_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // javac stops reporting after 100 errors by default, which hides the true scope of a
    // breaking change. Raise it so a failing build shows the whole picture at once.
    options.compilerArgs << '-Xmaxerrs' << '2000'
    // since JDK 23 javac only runs annotation processors (Lombok) when asked to
    options.compilerArgs << '-proc:full'
}

var fullname = "${mod_archive_name}-${mod_version} ${mod_stability_name}"

unifiedPublishing {
    project {
        gameVersions = [publish_mc_version]
        gameLoaders = [publish_modloader]
        displayName = fullname
        version = mod_version
        changelog = new File("${project.projectDir}/changelog.txt").text.replaceAll("VERSION_NAME", fullname)
        releaseType = mod_stability_name.toLowerCase()

        mainPublication tasks.jar

        var cfToken = System.getenv("CURSEFORGE_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = publish_curseforge_id
            }
        }

        // publish_modrinth_id is optional, so the property has to be checked as well as the
        // token. Referencing an undefined property fails the build outright, which is what
        // happened before: the token check alone let it through and then blew up here.
        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null && project.hasProperty("publish_modrinth_id")) {
            modrinth {
                token = mrToken
                id = project.property("publish_modrinth_id")
            }
        }
    }
}

test {
    useJUnitPlatform()
}

// MM registers config-defined ports and controllers at mod construction, so the game test server needs
// its definitions in run/test_server/config/mm before it starts.
tasks.register('copyGameTestConfig', Copy) {
    from 'src/test/gameTestConfig'
    into 'run/test_server/config'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'copyGameTestConfig'
}
